[package]
name = "oward"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
reqwest = { workspace = true, features = ["json"] }
ow_wallet_adapter.workspace = true
request.workspace = true
toml.workspace = true
dotenvy = "0.15.7"
network.workspace = true
contract_bindings.workspace = true
hex = "0.4.3"

# aws
aws_lambda_events = { version = "1.2.0", optional = true, features = ["sqs"] }
lambda_runtime = { version = "1.3.0", optional = true }
aws-config = { version = "1.11.0", features = [
    "behavior-version-latest",
], optional = true }
sqlx = { workspace = true, features = ["postgres"], optional = true }
aa_tx_request = { package = "tx_request", git = "https://github.com/originalworks/account-abstraction.git", optional = true }
aa_sqs_queue = { package = "sqs_queue", git = "https://github.com/originalworks/account-abstraction.git", optional = true }
tokenization_networks_db = { workspace = true, optional = true }
tokenization_requests_db = { workspace = true, optional = true }
agreements_indexer.workspace = true
ow_registry_indexer.workspace = true
aws-sdk-sqs = { version = "1.109.0", optional = true }
tokenization_request_batches_db = { workspace = true, optional = true }
[features]
aws = [
    "dep:aws-config",
    "dep:aws_lambda_events",
    "dep:lambda_runtime",
    "dep:sqlx",
    "dep:aa_tx_request",
    "dep:aa_sqs_queue",
    "dep:tokenization_networks_db",
    "dep:tokenization_requests_db",
    "dep:aws-sdk-sqs",
    "dep:tokenization_request_batches_db",
]

# AWS Lambda conected to the OW Account Abstraction Layer
[[bin]]
name = "aa_aws_lambda"
path = "src/bin/aa_aws_lambda.rs"
