[package]
name = "request"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
contract_bindings.workspace = true
sqlx = { workspace = true, features = ["postgres", "macros"] }
alloy.workspace = true

# aws
aws_lambda_events = { version = "1.2.0", optional = true, features = ["sqs"] }
lambda_runtime = { version = "1.3.0", optional = true }

[features]
aws = ["dep:aws_lambda_events", "dep:lambda_runtime"]
