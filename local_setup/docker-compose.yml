volumes:
  postgres_data:
  localstack_data:


services:
  e2e_test_runner:
    build: .
    depends_on:
      localstack:
        condition: service_healthy
      contracts_builder:
        condition: service_completed_successfully
      test_migration_runner:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy
    working_dir: /agreements
    volumes:
      - ../:/agreements
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - RPC_URL=http://anvil:${ANVIL_PORT}
      - ANVIL_PORT=${ANVIL_PORT}
      - ANVIL_CHAIN_ID=${ANVIL_CHAIN_ID}
      - USE_KMS=false
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AA_TX_REQUEST_QUEUE_MESSAGE_GROUP_ID="aa-standard-tx-request"
      - OWARD_INSTANCE_NAME="e2e-test"
      - PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 #anvil PK
    command: ["cargo", "test", "-p", "e2e_test", "--features", "aws", "--", "--no-capture", "--test-threads=1"]

  test_migration_runner:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /agreements/rust/database/migrator
    volumes:
      - ../:/agreements
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["cargo", "run", "--bin", "e2e_test_migrator"]
  
  anvil:
    image: ghcr.io/foundry-rs/foundry
    platform: linux/amd64
    entrypoint: anvil
    command:
      [
        "--host", "0.0.0.0",
        "--port", "${ANVIL_PORT}",
        "--chain-id", "${ANVIL_CHAIN_ID}",
        "--mnemonic", "${ANVIL_MNEMONIC}",
        "--accounts", "1000",
        "--balance", "10000"
      ]
    ports:
      - "${ANVIL_PORT}:${ANVIL_PORT}"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:${ANVIL_PORT}"]
      interval: 5s
      timeout: 3s
      retries: 5

  contracts_builder:
    image: node:22
    depends_on:
      anvil:
        condition: service_healthy
    working_dir: /agreements/contracts
    volumes:
      - ../:/agreements
    command: ["sh", "-c", "npm i && npx hardhat run scripts/execute/deployAll/e2eTokenizationTests.ts --network anvilDocker"]

  postgres:
    image: postgres:17
    container_name: local-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: $POSTGRES_DB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:4.14.0
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,events,iam,sts
      - AWS_DEFAULT_REGION=us-east-1
      - DEBUG=1
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 5

